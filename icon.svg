<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="#00ffff" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Neon grid lines -->
  <line x1="64" y1="128" x2="448" y2="128" stroke="#00ffff" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="64" y1="384" x2="448" y2="384" stroke="#ff0077" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Center Gravity Switch Arrows -->
  <g filter="url(#glow)">
    <!-- Up Arrow (Cyan) -->
    <path d="M 256,96 L 336,192 L 288,192 L 288,240 L 224,240 L 224,192 L 176,192 Z" fill="url(#cyanGrad)" />
    <!-- Down Arrow (Violet/Pink) -->
    <path d="M 256,416 L 336,320 L 288,320 L 288,272 L 224,272 L 224,320 L 176,320 Z" fill="url(#pinkGrad)" />
  </g>

  <!-- Glowing Player Cube in center -->
  <rect x="232" y="232" width="48" height="48" rx="8" fill="#ffffff" filter="url(#glow)"/>
  <rect x="238" y="238" width="36" height="36" rx="6" fill="#00ffff"/>
</svg>
